spring.application.name=lab10

# read .env
spring.config.import=optional:file:.env[.properties]

# Datasource
spring.datasource.url=${DB_URL:jdbc:sqlite:database.db}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Session Timeout
server.servlet.session.timeout=15m




